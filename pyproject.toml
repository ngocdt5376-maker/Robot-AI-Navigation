[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-ai-navigation"
version = "1.0.0"
description = "Mô phỏng robot thông minh tìm đường và khám phá mê cung bằng AI"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
